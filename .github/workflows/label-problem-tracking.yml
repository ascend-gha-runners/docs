name: Label Problem Tracking Issues

# 「问题登记」页生成的 issue 标题以「[缺陷]: 业务反馈」开头；
# 决策树自助解决（自愿登记）的标题以「[自助解决]:」开头。
# 新建 issue 页的 labels 参数提交时不保证生效，此工作流兜底：
# 标题匹配即自动补打对应标签，确保统计能收录所有登记。

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # issue 事件触发时 runner 不 checkout 仓库，gh 需用 -R 显式指定目标仓库，
      # 否则报 "fatal: not a git repository"
      - name: Add problem-tracking label
        if: "startsWith(github.event.issue.title, '[缺陷]: 业务反馈')"
        run: gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --add-label "problem-tracking"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Add self-resolved label
        if: "startsWith(github.event.issue.title, '[自助解决]:')"
        run: gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --add-label "self-resolved"
        env:
          GH_TOKEN: ${{ github.token }}
