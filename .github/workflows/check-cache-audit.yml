name: CI Cache Audit

on:
  schedule:
    - cron: "24 2 * * *" # 每天 10:24 北京时间 (UTC+8)
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Full scan: capped at 200 runs + 30 candidates + unlimited log aggregation (avoids API rate limit)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  repository_dispatch:
    types: [ci-config-update]

concurrency:
  group: ci-cache-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CACHE_AUDIT_TOKEN }}
      PYPI_CACHE_HOST: ${{ vars.PYPI_CACHE_HOST || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}
      APT_CACHE_PORT: ${{ vars.APT_CACHE_PORT || '8081' }}
      RUNNER_FILTER: ${{ vars.RUNNER_FILTER || 'linux-aarch64,linux-amd64' }}
      # 每日定时 = 全量扫描；repository_dispatch = 增量（只更新有证据的格子）
      # 手动触发 = 按 full_scan 选项
      IS_FULL_SCAN: ${{ (github.event_name == 'schedule' || inputs.full_scan == 'true') }}
      IS_INCREMENTAL: ${{ github.event_name == 'repository_dispatch' }}
      MAX_NPU_SEARCH: ${{ (github.event_name == 'schedule' || inputs.full_scan == 'true') && '0' || (vars.MAX_NPU_SEARCH || '50') }}
      MAX_CANDIDATES: ${{ (github.event_name == 'schedule' || inputs.full_scan == 'true') && '0' || (vars.MAX_CANDIDATES || '15') }}
      MAX_LOGS_TO_CHECK: ${{ (github.event_name == 'schedule' || inputs.full_scan == 'true') && '0' || (vars.MAX_LOGS_TO_CHECK || '10') }}
      PARALLEL: ${{ vars.PARALLEL || '4' }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CACHE_AUDIT_TOKEN }}

      - name: Install dependencies
        run: sudo apt-get install -y jq

      # ================================================================
      # Phase 1: Discover new repos from ascend-ci-deployment
      # ================================================================
      - name: Discover new repos from deployment repo
        id: discover
        continue-on-error: true
        run: python3 scripts/ci-audit/discover_new_repos.py

      # ================================================================
      # Phase 2: Refresh cluster map from deployment repo
      # ================================================================
      - name: Generate cluster map
        continue-on-error: true
        run: python3 scripts/cluster-map/generate_cluster_map.py

      # ================================================================
      # Phase 3: Existing daily cache audit
      # ================================================================
      - name: Generate repos list from Repo.md
        run: |
          REPOS=$(grep -oE '\[([a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+)\]\(https://github\.com/' docs/Repo.md \
            | grep -oE '[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+')

          > /tmp/audit_repos.txt
          while IFS= read -r REPO; do
            MAPPING=$(grep "^${REPO}|" scripts/ci-audit/repos.txt 2>/dev/null || true)
            if [ -n "$MAPPING" ]; then
              echo "$MAPPING" >> /tmp/audit_repos.txt
            else
              echo "$REPO" >> /tmp/audit_repos.txt
            fi
          done <<< "$REPOS"

          echo "=== 本次审计仓库列表 ==="
          cat /tmp/audit_repos.txt

      - name: Run log-based cache audit
        id: audit
        run: |
          bash scripts/ci-audit/check_cache_from_logs.sh /tmp/audit_repos.txt | tee audit_result.md

      - name: Update Repo.md with audit results
        run: |
          # Fetch latest Repo.md from origin/main to avoid stale data
          # (concurrent runs may have pushed updates after our checkout)
          git fetch origin main
          git checkout origin/main -- docs/Repo.md
          python3 scripts/ci-audit/update_repo_md.py \
            audit_result.md \
            scripts/ci-audit/repos.txt \
            docs/Repo.md \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$IS_INCREMENTAL"

      - name: Commit updated Repo.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push with retry: if another run pushed between our fetch and push,
          # re-fetch latest, re-run update_repo_md.py, re-commit
          for attempt in 1 2 3; do
            git add docs/Repo.md docs/Cluster.md scripts/ci-audit/repos.txt
            if git diff --cached --quiet; then
              echo "No changes to Repo.md"
              break
            fi
            git commit -m "docs: update cache audit status in Repo.md"

            if git push "https://x-access-token:${{ secrets.CACHE_AUDIT_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main 2>/dev/null; then
              echo "Push succeeded (attempt $attempt)"
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed, re-fetching latest..."
              # Save untracked files that update_repo_md.py needs
              cp audit_result.md /tmp/audit_result_retry.md
              cp scripts/ci-audit/repos.txt /tmp/repos_retry.txt 2>/dev/null || true
              # Reset to latest origin/main
              git fetch origin main
              git reset --hard origin/main
              # Restore saved files
              cp /tmp/audit_result_retry.md audit_result.md
              cp /tmp/repos_retry.txt scripts/ci-audit/repos.txt 2>/dev/null || true
              # Re-run update with fresh Repo.md
              python3 scripts/ci-audit/update_repo_md.py \
                audit_result.md \
                scripts/ci-audit/repos.txt \
                docs/Repo.md \
                "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                "$IS_INCREMENTAL"
            else
              echo "::error::All push attempts failed"
              exit 1
            fi
          done

      - name: Write job summary
        if: always()
        run: |
          echo "## CI 缓存审计报告（基于运行日志）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "运行时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') (CST)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat audit_result.md >> $GITHUB_STEP_SUMMARY
